name: pag_flutter
description: "A Flutter plugin for PAG(Portable Animated Graphics) files that renders After Effects animations natively across multiple platforms."
version: 1.0.0
repository: "https://github.com/yanshouwang/pag-flutter"
issue_tracker: "https://github.com/yanshouwang/pag-flutter/issues"
topics:
  - libpag
  - pag

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  pag_platform_interface: ^1.0.0
  pag_android: ^1.0.0
  pag_darwin: ^1.0.0
  pag_web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: pag_android
      ios:
        default_package: pag_darwin
      macos:
        default_package: pag_darwin
      web:
        default_package: pag_web
